<body>
<div class="page"><div class="phone"><div class="screen">
  <div class="topbar">
    <div class="statusbar"><span>9:41</span><span>2 Minute Budget</span></div>
    <h1 class="title" id="stepTitle">2 Minute Budget</h1>
    <p class="subtitle" id="stepSubtitle">A few figures, then set your sliders.</p>
    <div class="progress" id="progress"></div>
  </div>
  <div class="content">

    <!-- Step 0: Basics — the only form step. Every other number in the budget is
         a slider on step 1. Fields here are the ones the sliders need to compute
         peer defaults from: income (the pool), plus gender/age/household/ZIP as
         segmentation context. -->
    <section class="step" data-step="0">
      <div class="card">
        <div class="card-title">About you</div>
        <div class="two">
          <div class="field">
            <label>Gender</label>
            <select id="gender">
              <option value="">Select</option>
              <option value="female">Female</option>
              <option value="male">Male</option>
              <option value="nonbinary">Non-binary</option>
              <option value="unspecified">Prefer not to say</option>
            </select>
          </div>
          <div class="field">
            <label>Age</label>
            <input id="age" type="number" min="18" max="99" inputmode="numeric" placeholder="e.g. 32"/>
          </div>
        </div>
        <div class="two">
          <div class="field">
            <label>Household size</label>
            <select id="householdSize" onchange="onHouseholdChange()">
              <option value="1">1 (just me)</option>
              <option value="2">2 people</option>
              <option value="3">3 people</option>
              <option value="4">4 people</option>
              <option value="5">5 people</option>
              <option value="6">6 people</option>
              <option value="7">7 people</option>
              <option value="8">8+ people</option>
            </select>
          </div>
          <div class="field">
            <label>ZIP code</label>
            <input id="zip" inputmode="numeric" maxlength="5" value="95126" placeholder="ZIP"/>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Income</div>

        <!-- Gross (pre-tax) income with an annual|monthly toggle, default annual.
             Net is derived (estimateCaTax) and shown as a helper line — the budget
             model runs on monthly net, but users know their gross salary. -->
        <div class="field">
          <label>Gross income, before taxes <span style="font-size:10px;color:var(--danger);font-weight:400;">(required)</span></label>
          <div class="seg-toggle">
            <button type="button" class="seg-btn active" id="modeAnnual" onclick="setIncomeMode('annual')">Annual</button>
            <button type="button" class="seg-btn" id="modeMonthly" onclick="setIncomeMode('monthly')">Monthly</button>
          </div>
          <input id="grossIncome" type="text" inputmode="decimal" placeholder="e.g. 120,000"
            oninput="onIncomeInput()"
            onfocus="moneyFocus(this)" onblur="moneyBlur(this)"/>
          <div class="helper" id="netHelper" style="margin-top:7px">Enter your income to estimate take-home pay.</div>
        </div>

        <!-- Income-vs-ZIP-average thermometer + sentence (needs ZIP match + income) -->
        <div id="colThermo" style="display:none;margin:14px 0 2px">
          <div class="thermo-wrap">
            <div class="thermo-track"></div>
            <div class="thermo-fill" id="thermoFill"></div>
            <div class="thermo-marker" id="thermoNatl" style="background:var(--muted)"></div>
            <div class="thermo-marker" id="thermoZip" style="background:var(--accent)"></div>
            <div class="thermo-lbl" id="thermoNatlLabel" style="color:var(--muted)">ZIP avg</div>
            <div class="thermo-lbl" id="thermoZipLabel" style="color:var(--accent)">You</div>
          </div>
          <div id="zipSentence" class="helper" style="margin-top:4px;font-size:11px;line-height:1.45"></div>
        </div>
      </div>
    </section>

    <!-- Step 1: Adjust — all 8 categories as sliders, including the formerly
         form-entered Housing and Bills. Saving posts straight to the parent;
         there is no review step (the post-result screen is the review). -->
    <section class="step hidden" data-step="1">
      <!-- Pinned metrics: stay fixed at top while the category buckets scroll
           underneath. The screen-colored bottom padding is the clean divider. -->
      <div class="adjust-pinned">
        <div class="summary-grid" style="margin:0;">
          <div class="metric">
            <div class="metric-label">Monthly take-home</div>
            <div class="metric-value" id="finalRemainder">$0</div>
            <div class="metric-note">After estimated taxes</div>
          </div>
          <div class="metric">
            <div class="metric-label" id="unallocatedLabel">Unallocated</div>
            <div class="metric-value" id="unallocated">$0</div>
            <div class="metric-note" id="unallocatedNote">Remaining</div>
          </div>
        </div>
      </div>
      <!-- Scrollable bucket cards -->
      <div id="adjustBuckets"></div>
    </section>

  </div><!-- /.content -->
  <div class="nav">
    <button class="secondary" id="backBtn" onclick="back()">Back</button>
    <button class="primary" id="nextBtn" onclick="next()">Next</button>
  </div>
</div></div></div>

<script>
window.onerror = function(msg, src, line) {
  var d = document.createElement("div");
  d.style = "position:fixed;top:0;left:0;right:0;background:var(--danger);color:#fff;font-size:11px;padding:6px;z-index:9999;";
  d.textContent = "JS error: " + msg + " (line " + line + ")";
  document.body.appendChild(d);
};

// ── Constants ──────────────────────────────────────────────────────────────
// avgIncome = average household GROSS income per month for the ZIP — feeds the
// Basics-step thermometer (your income vs the average for your ZIP). The cost
// `index` still drives the slider defaults; the thermometer no longer shows it.
const ZIP_DATA = {
  "95126": { label: "95126 San Jose",      index: 145, state: "CA", avgIncome: 11700 },
  "95014": { label: "95014 Cupertino",     index: 170, state: "CA", avgIncome: 17500 },
  "95054": { label: "95054 Santa Clara",   index: 155, state: "CA", avgIncome: 12800 }
};

// Combined federal + state marginal tax rates by bracket and state
const STATE_TAX_RATES = {
  "CA": [
    { annual: 20000,  rate: 0.12 },   // fed 11% + CA 1%
    { annual: 40000,  rate: 0.18 },   // fed 16% + CA 2%
    { annual: 60000,  rate: 0.24 },   // fed 20% + CA 4%
    { annual: 80000,  rate: 0.30 },   // fed 24% + CA 6%
    { annual: 120000, rate: 0.36 },   // fed 28% + CA 8%
    { annual: 200000, rate: 0.413 },  // fed 32% + CA 9.3%
    { annual: Infinity, rate: 0.503 } // fed 37% + CA 13.3%
  ]
};

const steps = [
  ["2 Minute Budget", "A few figures, then set your sliders."],
  ["Adjust",          "Drag each category. We started you at typical spending."]
];

// BLS CE Survey — % of AFTER-TAX income by income quintile. Every row sums to
// 100%, which is what lets the sliders seed a fully-allocated budget: each
// bucket takes its share of net income and the last one absorbs the rounding.
//
// NOTE the rebase: these used to be "% of the flexible pool left after housing
// and bills were typed in as fields". Housing and bills are sliders now, so
// there is no pre-slider pool — percentages are of net income, and the housing
// and bills rows are new. Lower quintiles carry more housing and less savings.
const SEG = [
  { max: 2500,     housing: 42, bills: 14, food: 16, transport: 10, health: 6, lifestyle:  5, debt: 5, savings:  2 },
  { max: 4000,     housing: 38, bills: 13, food: 15, transport: 10, health: 7, lifestyle:  6, debt: 6, savings:  5 },
  { max: 6500,     housing: 34, bills: 12, food: 13, transport:  9, health: 8, lifestyle:  8, debt: 7, savings:  9 },
  { max: 10000,    housing: 30, bills: 11, food: 12, transport:  9, health: 8, lifestyle:  9, debt: 7, savings: 14 },
  { max: Infinity, housing: 26, bills: 10, food: 11, transport:  8, health: 7, lifestyle: 10, debt: 6, savings: 22 }
];

// Slider range rule: the right edge is anchored to the AVERAGE for the user's
// income tier, not a fixed number — "avg 30% rent → max 60%" style. SPREAD is a
// stand-in for how many standard deviations of real-world variance a category
// has (debt and savings vary wildly between households; housing and bills are
// tighter), balanced against usability. maxPct = clamp(avg × spread, avg + 10,
// RANGE_CAP): the floor guarantees drag room when a tier's average is tiny
// (low-tier savings avg is 2%), the cap keeps the drag scale usable. Left edge
// is always $0. See rangeMaxPct().
const SPREAD = {
  housing: 2.0, bills: 2.0, food: 2.2, transport: 2.2,
  health: 2.5, lifestyle: 2.5, debt: 4.0, savings: 4.0
};
const RANGE_CAP = 65;

function rangeMaxPct(key, seg) {
  var avg = seg[key] || 0;
  return Math.min(RANGE_CAP, Math.max(avg * SPREAD[key], avg + 10));
}

// How strongly each category's DEFAULT tracks the ZIP cost-of-living index
// (the "modifier" in gov+modifier). Housing is fully local; groceries, bills
// and transport partially; the rest aren't location-priced. Savings has no
// entry because it's seeded as the residual (net − everything else, floored
// at 0) — the local premium comes out of savings first, which is also how it
// works in real life. NOTE: this means a pricey ZIP on a modest income can
// open the budget already overspent. That is intentional and user-confirmed —
// the totals bar says "Overspent" honestly rather than pretending balance.
// Household size is deliberately NOT a seeding modifier: the SEG quintile
// percentages are household-level BLS figures already, so multiplying by
// householdMultiplier() would double-count.
const ZIP_SENSITIVITY = { housing: 1.0, bills: 0.5, food: 0.5, transport: 0.5,
                          health: 0, lifestyle: 0, debt: 0 };

function zipMod(key) {
  return 1 + (zipMultiplier() - 1) * (ZIP_SENSITIVITY[key] || 0);
}

// Slider increment, sized to the expense: dragging housing in $10 steps would
// take 200 drags. Scaled up again for higher incomes — see stepFor().
const STEP_BASE = {
  housing: 50, bills: 25, food: 10, transport: 10,
  health: 10, lifestyle: 10, debt: 25, savings: 25
};

const SUB = {
  housing:   ["Rent / Mortgage", "HOA / PMI / Property Fees", "Utilities"],
  bills:     ["Medical / Insurance", "Car / Transit Fixed", "Phone Plan", "Home Internet", "Other Required Costs"],
  food:      ["Groceries", "Dining Out", "Coffee & Drinks", "Delivery", "Household Supplies"],
  transport: ["Gas & Charging", "Car Maintenance", "Rideshare & Transit", "Parking & Tolls", "Vehicle Registration"],
  health:    ["Medical Copays", "Dental & Vision", "Prescriptions & OTC", "Gym & Fitness", "Education & Tuition", "Books & Courses"],
  lifestyle: ["Entertainment", "Streaming & Subs", "Clothing & Shoes", "Personal Care", "Hobbies & Travel", "Gifts & Giving"],
  debt:      ["Credit Card Payments", "Student Loan Payments", "Auto / Personal Loans", "Other Debt Payments"],
  savings:   ["Emergency Fund", "Retirement (IRA/401k)", "Investments", "Extra Debt Payments"]
};

const BUCKETS = [
  // Housing and Bills were multi-field form steps until the 2 Minute Budget
  // redesign. They are single rolled-up sliders now; the payload splits them
  // back into the individual fields the budget model expects (HOUSING_SPLIT).
  { key: "housing",   label: "Housing",              icon: "\uD83C\uDFE0" },
  { key: "bills",     label: "Bills & Required",     icon: "\uD83E\uDDFE" },
  { key: "food",      label: "Food & Daily",        icon: "\uD83D\uDED2" },
  { key: "transport", label: "Transportation",       icon: "\uD83D\uDE97" },
  { key: "health",    label: "Health & Education",   icon: "\u2695\uFE0F" },
  { key: "lifestyle", label: "Lifestyle",            icon: "\u2728" },
  // Total monthly debt payments. Its own lever so lifestyle-driven savings dips
  // never eat into debt servicing \u2014 savings can run negative against buffered
  // cash, debt payments stay funded. Savings remains last (absorbs rounding).
  { key: "debt",      label: "Debt Payments",        icon: "\uD83D\uDCB3" },
  { key: "savings",   label: "Savings & Future",     icon: "\uD83D\uDCB0" }
];

// The rolled-up Housing and Bills sliders are split back into the individual
// fields wizard-bridge.js maps (it still expects the old per-field payload, and
// the app's budget model has separate lines for utilities, phone, etc).
// Ratios are the previous hand-entered defaults' proportions:
//   housing 2600 / extras 0 / utilities 250                          — of 2850
//   medical 250 / transport 350 / phone 85 / internet 70 / other 100 — of 855
// The last key in each list absorbs rounding so the parts re-sum to the whole.
const HOUSING_SPLIT = [["housing", 0.912], ["housingExtras", 0], ["utilities", 0.088]];
const BILLS_SPLIT   = [["medical", 0.292], ["transportFixed", 0.409], ["phone", 0.099],
                       ["internet", 0.082], ["otherFixed", 0.117]];

// Splits one rolled-up slider total into its constituent payload fields.
function splitBucket(total, split) {
  var out = {}, allocated = 0;
  for (var i = 0; i < split.length; i++) {
    if (i < split.length - 1) {
      out[split[i][0]] = Math.round(total * split[i][1]);
      allocated += out[split[i][0]];
    } else {
      out[split[i][0]] = Math.max(0, Math.round(total) - allocated);
    }
  }
  return out;
}

// ── State ──────────────────────────────────────────────────────────────────
var step = 0;
var adjustVals = {};
var adjustExpanded = {};
var adjustWizardShown = false;
var incomeMode = "annual";   // "annual" | "monthly" — how grossIncome is entered

// ── Theme bridge + prefill ─────────────────────────────────────────────────
window.addEventListener("message", function(e) {
  if (!e.data) return;
  if (e.data.type === "bb-theme") {
    document.body.classList.toggle("dark-mode", e.data.colorMode === "dark");
  }
  // Re-entry from "Edit Budget": restore what the user last saved.
  if (e.data.type === "bb-prefill") {
    var d = e.data.inputs;
    if (!d) return;

    if (d.zip && $("zip")) $("zip").value = d.zip;
    if ($("gender") && d.gender) $("gender").value = d.gender;
    if ($("age") && d.age > 0)   $("age").value = d.age;

    // householdSize is the current field; dependents is what older payloads
    // carried (household = dependents + 1).
    var hh = d.householdSize || (d.dependents != null ? +d.dependents + 1 : 0);
    if ($("householdSize") && hh > 0) $("householdSize").value = String(Math.min(8, Math.max(1, Math.round(hh))));

    // Income was stored as monthly pre-tax; show it in whichever mode was used.
    if ($("grossIncome") && d.preIncome > 0) {
      setIncomeMode(d.incomeMode === "monthly" ? "monthly" : "annual");
      var shown = incomeMode === "annual" ? Math.round(d.preIncome * 12) : Math.round(d.preIncome);
      $("grossIncome").value = shown.toLocaleString();
    }

    if (d.adjustVals && typeof d.adjustVals === "object") {
      adjustVals = JSON.parse(JSON.stringify(d.adjustVals));
      // Older payloads had no housing/bills sliders — those were separate
      // fields. Roll them back up so re-entry lands on the 8-slider screen
      // with the user's real numbers instead of re-seeding from peer averages.
      if (adjustVals.housing == null) {
        adjustVals.housing = (+d.housing || 0) + (+d.housingExtras || 0) + (+d.utilities || 0);
      }
      if (adjustVals.bills == null) {
        adjustVals.bills = (+d.medical || 0) + (+d.transportFixed || 0) +
                           (+d.phone || 0) + (+d.internet || 0) + (+d.otherFixed || 0);
      }
    }
    onIncomeInput();
    renderSummary();
  }
});

// ── Utilities ──────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);

function parseFmt(str) {
  return parseFloat((str || "").replace(/[$,\s]/g, "")) || 0;
}

function money(n) {
  var sign = n < 0 ? "-" : "";
  return sign + "$" + Math.abs(Math.round(n)).toLocaleString();
}

function num(id) {
  var el = $(id);
  return el ? parseFmt(el.value) : 0;
}

// Format currency inputs on focus (strip) / blur (add commas)
function moneyFocus(el) {
  var v = parseFmt(el.value);
  el.value = v > 0 ? String(v) : "";
}

function moneyBlur(el) {
  var v = parseFmt(el.value);
  el.value = v > 0 ? v.toLocaleString() : "";
  renderSummary();
}

// ── Income / ZIP helpers ───────────────────────────────────────────────────
// Gross is what the user types (annual by default — that's how people know
// their salary). Everything downstream runs on monthly NET, derived here.
function grossMonthly() {
  var v = num("grossIncome");
  return incomeMode === "annual" ? v / 12 : v;
}

function monthlyIncome() {
  var g = grossMonthly();
  if (g <= 0) return 0;
  return estimateCaTax(g, dependentsCount());
}

// The tax estimate still thinks in dependents; household size is the field.
function dependentsCount() { return Math.max(0, num("householdSize") - 1); }

function setIncomeMode(mode) {
  var prev = incomeMode;
  incomeMode = mode === "monthly" ? "monthly" : "annual";
  if ($("modeAnnual"))  $("modeAnnual").classList.toggle("active", incomeMode === "annual");
  if ($("modeMonthly")) $("modeMonthly").classList.toggle("active", incomeMode === "monthly");
  // Convert what's already typed so the figure keeps meaning the same money.
  var el = $("grossIncome");
  if (el && prev !== incomeMode) {
    var v = parseFmt(el.value);
    if (v > 0) {
      var converted = incomeMode === "monthly" ? Math.round(v / 12) : Math.round(v * 12);
      el.value = converted.toLocaleString();
    }
  }
  if (el) el.placeholder = incomeMode === "annual" ? "e.g. 120,000" : "e.g. 10,000";
  onIncomeInput();
}

// Shows the derived take-home under the income field. Net is no longer an
// input — the wizard owns the estimate so there's one less thing to fill in.
function renderNetHelper() {
  var el = $("netHelper");
  if (!el) return;
  var g = grossMonthly();
  if (g <= 0) { el.textContent = "Enter your income to estimate take-home pay."; return; }
  el.textContent = "≈ " + money(monthlyIncome()) + "/mo take-home after estimated taxes";
}

function onIncomeInput() {
  renderNetHelper();
  renderSummary();
  checkStep0Next();
}

function onHouseholdChange() {
  // Household size feeds the tax estimate (dependent deductions), so the
  // take-home line has to move with it.
  onIncomeInput();
}

function estimateCaTax(mg, dependents) {
  var a = mg * 12;  // annual income
  var zo = zipObj();
  var state = (zo && zo.state) || "CA";
  var stateBrackets = STATE_TAX_RATES[state] || STATE_TAX_RATES["CA"];

  // Find the combined tax rate (federal + state) for this income level
  var r = 0.24;  // default fallback
  for (var i = 0; i < stateBrackets.length; i++) {
    if (a <= stateBrackets[i].annual) {
      r = stateBrackets[i].rate;
      break;
    }
  }

  // Each dependent's standard deduction ($4,700) × marginal rate = tax savings
  var depSavings = (dependents || 0) * 4700 * r;
  var baseTax = a * r;
  var adjustedTax = Math.max(0, baseTax - depSavings);
  var afterTaxAnnual = a - adjustedTax;
  return Math.round(afterTaxAnnual / 12);
}

// Income is the only required field — without it there is no pool to slice.
function checkStep0Next() {
  if (step !== 0 || !$("nextBtn")) return;
  $("nextBtn").disabled = grossMonthly() <= 0;
}

function zipEntry()      { return ($("zip") && $("zip").value || "").trim(); }
function zipObj()        { return ZIP_DATA[zipEntry()] || null; }
function zipIndex()      { return (zipObj() && zipObj().index) || 100; }
function zipMultiplier() { return zipIndex() / 100; }
function householdMultiplier() { return 1 + dependentsCount() * .42; }

// Housing and Bills are sliders now, so these read from adjustVals rather than
// from form fields. Kept because renderSummary/results still talk in these terms.
function housingCosts() { return adjustVals.housing || 0; }
function fixedCosts()   { return housingCosts() + (adjustVals.bills || 0); }
function pctDiff(v, b)  { return Math.round(((v - b) / b) * 100); }

function getSegment(net) {
  return SEG.find(function(s) { return net <= s.max; }) || SEG[SEG.length - 1];
}

// ── Thermometer ──────────────────────────────────────────────────────────────
// YOUR income vs the ZIP's average household income (NOT cost of living —
// the cost index still shapes the slider defaults, but the comparison the
// user sees here is "how does my income stack up in my ZIP"). The #thermoNatl
// marker holds the ZIP-average position, #thermoZip holds the user's — the
// ids predate the income flip and are left alone to keep the edit surgical.
function updateThermometer(zipAvg, gross, show) {
  var tDiv = $("colThermo");
  if (!tDiv) return;

  if (!show) { tDiv.style.display = "none"; return; }
  tDiv.style.display = "";

  var barMax  = Math.max(gross, zipAvg);
  var avgPct  = Math.max(2, Math.min(98, (zipAvg / barMax * 100))).toFixed(1);
  var userPct = Math.max(2, Math.min(98, (gross / barMax * 100))).toFixed(1);

  var nEl = $("thermoNatl"), zEl = $("thermoZip");
  var fEl = $("thermoFill"), nLbl = $("thermoNatlLabel"), zLbl = $("thermoZipLabel");

  if (nEl)  nEl.style.left = avgPct + "%";
  if (zEl)  zEl.style.left = userPct + "%";

  var fLeft  = Math.min(+avgPct, +userPct);
  var fWidth = Math.abs(+userPct - +avgPct);
  var diff = pctDiff(gross, zipAvg);
  if (fEl) {
    fEl.style.left  = fLeft + "%";
    fEl.style.width = fWidth + "%";
    fEl.style.background = diff >= 0 ? "var(--accent)" : "var(--warn)";
  }
  if (nLbl) nLbl.style.left = avgPct + "%";
  if (zLbl) {
    zLbl.style.left = userPct + "%";
    zLbl.textContent = diff > 0 ? "+" + diff + "% vs avg" : (diff < 0 ? diff + "% vs avg" : "at avg");
    zLbl.style.color = diff > 0 ? "var(--accent)" : (diff < 0 ? "var(--warn)" : "var(--muted)");
  }
}


// ── Summary / comparisons ────────────────────────────────────────────────────
function updateComparisons() {
  var z = zipObj(), gross = grossMonthly();
  var zipText;
  if (z && gross > 0) {
    var d = pctDiff(gross, z.avgIncome);
    zipText = "Households in " + z.label + " average about " + money(z.avgIncome) +
      "/mo before taxes \u2014 your income is " +
      (d === 0 ? "right at that average." : Math.abs(d) + "% " + (d > 0 ? "above" : "below") + " that.");
  } else if (z) {
    zipText = "Households in " + z.label + " average about " + money(z.avgIncome) +
      "/mo before taxes. Enter your income to see how you compare.";
  } else {
    zipText = "No supported ZIP entered \u2014 using national averages.";
  }
  if ($("zipSentence")) $("zipSentence").textContent = zipText;
  updateThermometer(z ? z.avgIncome : 0, gross, !!z && gross > 0);
}

// The housing/bills metric tiles this used to feed were removed along with
// their form steps — the ZIP thermometer is all that's left on the Basics step.
function renderSummary() {
  updateComparisons();
}

// ── Adjust step ────────────────────────────────────────────────────────────
function showAdjustWizardPopup() {
  var bg = document.createElement("div");
  bg.style.cssText = "position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:999";

  var card = document.createElement("div");
  card.style.cssText = "background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:300px;box-shadow:0 8px 32px rgba(0,0,0,0.24)";

  card.innerHTML =
    '<div style="font-size:16px;font-weight:850;margin-bottom:12px;color:var(--text)">We started you at typical spending</div>' +
    '<div style="font-size:12px;line-height:1.45;color:var(--text);margin-bottom:16px">Every slider is set to what people at your income level typically spend. Drag them to match your real life — nothing here has to be exact, and you can change it later.</div>' +
    '<button type="button" style="width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:13px;font-size:14px;font-weight:850;cursor:pointer;border:1px solid var(--accent)" onclick="this.parentNode.parentNode.remove()">Got it</button>';

  bg.appendChild(card);
  document.body.appendChild(bg);
}

// Slider increment for a category, scaled up at higher incomes so the drag
// distance stays sane when the numbers get big.
function stepFor(key) {
  var net = monthlyIncome();
  var mult = net > 12000 ? 4 : (net > 6000 ? 2 : 1);
  return (STEP_BASE[key] || 10) * mult;
}

function initAdjustStep() {
  var net = monthlyIncome();
  var seg = getSegment(net);

  // Seed every slider at gov+modifier peer spending: the BLS quintile share of
  // net income (SEG), scaled by the ZIP cost-of-living index per category
  // (ZIP_SENSITIVITY). Savings is NOT seeded from its SEG share — it's the
  // residual (net − everything else, floored at 0), so a pricey ZIP eats
  // savings first, and once savings hits $0 the budget opens overspent and the
  // totals bar says so. In a national-average ZIP the modifiers are all 1 and
  // savings lands exactly on its SEG share (rows sum to 100).
  if (Object.keys(adjustVals).length === 0) {
    var allocated = 0;
    for (var i = 0; i < BUCKETS.length; i++) {
      var b = BUCKETS[i];
      var st = stepFor(b.key);
      if (b.key !== "savings") {
        adjustVals[b.key] = Math.round(net * seg[b.key] / 100 * zipMod(b.key) / st) * st;
        allocated += adjustVals[b.key];
      } else {
        adjustVals[b.key] = Math.max(0, Math.round(net - allocated));
      }
    }
  }
  adjustExpanded = {};
  renderAdjustBuckets();
  if (!adjustWizardShown) { adjustWizardShown = true; showAdjustWizardPopup(); }
}

function toggleAdjustExpand(key) {
  adjustExpanded[key] = !adjustExpanded[key];
  renderAdjustBuckets();
}

function renderAdjustBuckets() {
  var net = monthlyIncome();
  var seg = getSegment(net);
  updateAdjustHeader();

  var html = "";
  BUCKETS.forEach(function(b) {
    var st        = stepFor(b.key);
    var minAmt    = 0;
    var maxAmt    = Math.max(st, Math.round(net * rangeMaxPct(b.key, seg) / 100 / st) * st);
    var avgAmt    = Math.round(net * seg[b.key] / 100 * zipMod(b.key) / st) * st;
    var curAmt    = adjustVals[b.key] || 0;
    // Never let the range clip a real value (typed amounts and ZIP-modified
    // seeds can exceed the spread-rule max — the slider must still reach them).
    if (curAmt > maxAmt) maxAmt = Math.ceil(curAmt / st) * st;
    var sliderVal = Math.min(Math.max(curAmt, minAmt), maxAmt);
    var expanded  = !!adjustExpanded[b.key];
    var fmtAmt    = curAmt > 0 ? curAmt.toLocaleString() : "0";

    var subItemsHtml = "";
    if (expanded) {
      subItemsHtml =
        '<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line)">' +
        SUB[b.key].map(function(item) {
          return '<div style="padding:2px 0;font-size:11px;color:var(--muted)">' + item + '</div>';
        }).join("") + "</div>";
    }

    // Compact row: name + % + $ input + include-toggle all on the header line,
    // so ~5 sliders fit a screen. The toggle sits at the far right of the row.
    html +=
      '<div class="card adj-card">' +
        '<div class="budget-head adj-head">' +
          '<div class="adj-name">' + b.icon + ' ' + b.label + '</div>' +
          '<div class="adj-pct" id="adj-pct-' + b.key + '">' +
            Math.round((curAmt / (net || 1)) * 100) + '%' +
          '</div>' +
          '<div class="budget-amount-wrap">' +
            '<span class="budget-dollar">$</span>' +
            '<input class="budget-amount-input" id="adj-input-' + b.key + '" type="text" inputmode="decimal" value="' + fmtAmt + '" ' +
              'onfocus="moneyFocus(this)" ' +
              'onblur="adjustAmtBlur(this,\'' + b.key + '\')" ' +
              'oninput="adjustVals[\'' + b.key + '\']=parseFmt(this.value);syncAdjustSlider(\'' + b.key + '\');updateAdjustBucket(\'' + b.key + '\')" ' +
              'style="width:62px">' +
          '</div>' +
          '<button type="button" class="adj-info" title="Things to include" ' +
            'onclick="toggleAdjustExpand(\'' + b.key + '\')">' +
            (expanded ? "\u25B2" : "\u25BC") +
          '</button>' +
        '</div>' +
        '<input type="range" id="adj-slider-' + b.key + '" min="' + minAmt + '" max="' + maxAmt + '" step="' + st + '" value="' + sliderVal + '" ' +
          'class="adj-slider" ' +
          'oninput="adjustVals[\'' + b.key + '\']=+this.value;syncAdjustInput(\'' + b.key + '\');updateAdjustBucket(\'' + b.key + '\')">' +
        '<div class="slider-labels" style="font-size:10px;color:var(--muted)">' +
          '<span>' + money(minAmt) + '</span>' +
          '<span>typical ' + money(avgAmt) + '</span>' +
          '<span>' + money(maxAmt) + '</span>' +
        '</div>' +
        subItemsHtml +
      '</div>';
  });

  if ($("adjustBuckets")) $("adjustBuckets").innerHTML = html;
}

function adjustAmtBlur(el, key) {
  var v = parseFmt(el.value);
  var st = stepFor(key);
  adjustVals[key] = Math.round(v / st) * st;
  el.value = adjustVals[key] > 0 ? adjustVals[key].toLocaleString() : "0";
  renderAdjustBuckets();
}

// Slider drag → write the matching $ field (looked up by stable id, so it
// targets the right bucket; the old value-substring querySelector matched the
// static HTML attribute, not the live element, and updated the wrong field/none).
function syncAdjustInput(key) {
  var inputEl = document.getElementById('adj-input-' + key);
  if (inputEl) inputEl.value = (adjustVals[key] || 0).toLocaleString();
}

// $ field typing → move the matching slider, WITHOUT re-rendering the bucket
// list (a full renderAdjustBuckets() rebuild destroyed the focused input and
// kicked the user out after every keystroke). Browser clamps to slider min/max.
function syncAdjustSlider(key) {
  var sliderEl = document.getElementById('adj-slider-' + key);
  if (sliderEl) sliderEl.value = adjustVals[key] || 0;
}

function updateAdjustBucket(key) {
  var net = monthlyIncome();
  var pctEl = document.getElementById('adj-pct-' + key);
  if (pctEl) pctEl.textContent = Math.round((adjustVals[key] || 0) / (net || 1) * 100) + '%';
  updateAdjustHeader();
}

// The running totals at the top. Overspending is allowed — the number just
// flips to "Overspent" in danger red rather than blocking anything.
function updateAdjustHeader() {
  var net = monthlyIncome();
  var allocated = BUCKETS.reduce(function(s, b) { return s + (adjustVals[b.key] || 0); }, 0);
  var leftOver = net - allocated;
  var isOver = leftOver < -1;
  var isNear = leftOver >= 0 && leftOver <= net * 0.02;

  if ($("finalRemainder")) $("finalRemainder").textContent = money(net);
  if ($("unallocatedLabel")) $("unallocatedLabel").textContent = isOver ? "Overspent" : "Unallocated";
  if ($("unallocated")) {
    $("unallocated").textContent = money(Math.abs(leftOver));
    $("unallocated").style.color = isOver ? "var(--danger)" : (isNear ? "#22c55e" : (leftOver > net * 0.02 ? "var(--warn)" : ""));
  }
  if ($("unallocatedNote")) {
    $("unallocatedNote").textContent = isOver ? "Over your take-home" : (isNear ? "Fully allocated!" : "Left to assign");
  }
}

// ── Save-time balancing ────────────────────────────────────────────────────
// Asked when Save is hit with >1% of take-home unallocated: proceed (leftover
// goes to savings) or go back to the sliders. Built with createElement rather
// than an HTML string so build_bb.py's escape check has nothing to trip on.
function showUnallocatedPrompt(leftOver) {
  var bg = document.createElement("div");
  bg.style.cssText = "position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:999";

  var card = document.createElement("div");
  card.style.cssText = "background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:320px;box-shadow:0 8px 32px rgba(0,0,0,0.24)";

  var msg = document.createElement("div");
  msg.style.cssText = "font-size:14px;line-height:1.45;color:var(--text);margin-bottom:16px";
  msg.textContent = "You still have " + money(leftOver) + " of your take-home unassigned. Save it as savings, or keep adjusting?";

  var saveBtn = document.createElement("button");
  saveBtn.type = "button";
  saveBtn.style.cssText = "width:100%;padding:12px;background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:13px;font-size:13px;font-weight:850;cursor:pointer;margin-bottom:8px";
  saveBtn.textContent = "Add " + money(leftOver) + " to Savings & save";
  saveBtn.onclick = function() { bg.remove(); saveBudget(); };

  var stayBtn = document.createElement("button");
  stayBtn.type = "button";
  stayBtn.style.cssText = "width:100%;padding:12px;background:var(--soft);color:var(--muted);border:1px solid var(--line);border-radius:13px;font-size:13px;font-weight:850;cursor:pointer";
  stayBtn.textContent = "Keep adjusting";
  stayBtn.onclick = function() { bg.remove(); };

  card.appendChild(msg);
  card.appendChild(saveBtn);
  card.appendChild(stayBtn);
  bg.appendChild(card);
  document.body.appendChild(bg);
}

// Sweeps unallocated take-home into savings. Called on every save: silently
// for sub-1% crumbs, and as the "proceed" path of showUnallocatedPrompt above.
// Overspend is never corrected — it saves exactly as the user set it.
function autoAllocateToSavings() {
  var net   = monthlyIncome();
  var total = BUCKETS.reduce(function(s, b) { return s + (adjustVals[b.key] || 0); }, 0);
  var left  = net - total;
  if (left > 0) adjustVals["savings"] = (adjustVals["savings"] || 0) + Math.round(left);
}

// ── Progress dots ──────────────────────────────────────────────────────────
function renderProgress() {
  var p = $("progress");
  if (!p) return;
  p.innerHTML = "";
  steps.forEach(function(_, i) {
    var d = document.createElement("div");
    d.className = "dot" + (i <= step ? " active" : "");
    p.appendChild(d);
  });
}

// ── Step render ────────────────────────────────────────────────────────────
function renderStep() {
  document.querySelectorAll(".step").forEach(function(el) {
    el.classList.toggle("hidden", parseInt(el.dataset.step) !== step);
  });
  $("stepTitle").textContent    = steps[step][0];
  $("stepSubtitle").textContent = steps[step][1];
  $("nextBtn").textContent      = step === 1 ? "Save budget" : "Next";
  $("nextBtn").disabled         = false;
  renderProgress();
  if (step === 0) { renderNetHelper(); checkStep0Next(); }
  if (step === 1) initAdjustStep();
  renderSummary();
}

// ── Navigation ─────────────────────────────────────────────────────────────
function next() {
  // Basics → Adjust
  if (step === 0) { step = 1; renderStep(); return; }

  // Adjust → save. No review step, but meaningfully-unallocated money (>1% of
  // take-home) gets one popup: dump it into savings and save, or keep
  // adjusting. Overspend never prompts — it saves as-is and the totals bar +
  // post-result screen show it honestly.
  var net = monthlyIncome();
  var total = BUCKETS.reduce(function(s, b) { return s + (adjustVals[b.key] || 0); }, 0);
  var leftOver = net - total;
  if (leftOver > net * 0.01) { showUnallocatedPrompt(leftOver); return; }
  saveBudget();
}

// Builds the payload and posts it. Sub-1% crumbs still sweep silently into
// savings so the saved plan lands exactly on take-home.
function saveBudget() {
  autoAllocateToSavings();

  var housingParts = splitBucket(adjustVals.housing || 0, HOUSING_SPLIT);
  var billsParts   = splitBucket(adjustVals.bills   || 0, BILLS_SPLIT);

  // Payload keeps the field-per-cost shape wizard-bridge.js maps. preIncome is
  // normalized to MONTHLY gross regardless of which mode was typed in, so the
  // bridge and any prefill never have to know about the toggle.
  var wizardInputs = {
    zip:            zipEntry(),
    gender:         ($("gender") && $("gender").value) || "",
    age:            num("age") || 0,
    householdSize:  Math.max(1, num("householdSize") || 1),
    dependents:     dependentsCount(),
    incomeMode:     incomeMode,
    preIncome:      Math.round(grossMonthly()),
    netIncome:      Math.round(monthlyIncome()),
    housing:        housingParts.housing,
    housingExtras:  housingParts.housingExtras,
    utilities:      housingParts.utilities,
    medical:        billsParts.medical,
    transportFixed: billsParts.transportFixed,
    phone:          billsParts.phone,
    internet:       billsParts.internet,
    otherFixed:     billsParts.otherFixed,
    adjustVals:     JSON.parse(JSON.stringify(adjustVals))
  };
  window.parent.postMessage({ type: "bb-complete", debts: [], inputs: wizardInputs }, "*");
}

function back() {
  // Step 0 is the first screen, so Back there leaves the wizard entirely.
  if (step <= 0) { window.parent.postMessage({ type: "bb-back" }, "*"); return; }
  step--;
  renderStep();
}

// ── Input listeners ────────────────────────────────────────────────────────
["zip", "gender", "age", "householdSize", "grossIncome"].forEach(function(id) {
  var el = $(id);
  if (!el) return;
  el.addEventListener("input",  function() { renderSummary(); });
  el.addEventListener("change", function() { renderSummary(); });
});

$("nextBtn").onclick = next;
$("backBtn").onclick = back;

// (The pre-filled cost inputs this used to format are sliders now — nothing
// on the Basics step ships with a numeric default.)

renderStep();
