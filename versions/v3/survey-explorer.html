<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lifestyle Survey — Explorer</title>
  <!-- Standalone under-the-hood view of the Lifestyle Survey (linked from the
       admin panel, opens in its own tab). Deliberately OUTSIDE the app shell,
       like the gate: it loads only the survey's content table, the bridge
       math, and the ZIP tables — never the app's screens or state engine, so
       exploring here can't disturb a session in the other tab. -->
  <style>
    :root {
      --bg:#eef1f7; --card:#fff; --text:#172033; --muted:#667085; --line:#d9dee8;
      --accent:#315efb; --soft:#f2f4f7; --good:#087443; --danger:#b42318; --warn:#a15c07;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#111318; --card:#1e2128; --text:#e3e6ef; --muted:#8b95a8;
              --line:#343844; --accent:#4f76fc; --soft:#23272f; --good:#3ecf8e;
              --danger:#f04438; --warn:#f5b547; }
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial,Helvetica,sans-serif; background:var(--bg);
           color:var(--text); font-size:13px; line-height:1.45; }
    header { padding:16px 22px 0; }
    h1 { margin:0; font-size:20px; font-weight:850; letter-spacing:-.02em; }
    .sub { color:var(--muted); font-size:12px; margin:4px 0 12px; }
    nav { display:flex; gap:6px; padding:0 22px 14px; flex-wrap:wrap; }
    nav button { padding:8px 14px; border:1px solid var(--line); border-radius:999px;
      background:var(--card); color:var(--text); font-weight:850; font-size:12px; cursor:pointer; }
    nav button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
    main { padding:0 22px 40px; max-width:1080px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
            padding:14px 16px; margin-bottom:12px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px; }
    .k { font-size:10px; font-weight:850; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
    .muted { color:var(--muted); }
    .pos { color:var(--accent); font-weight:850; } .neg { color:var(--good); font-weight:850; }
    .bad { color:var(--danger); font-weight:850; } .warn { color:var(--warn); font-weight:850; }
    table { border-collapse:collapse; width:100%; font-size:12px; }
    th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
    select, input { padding:7px 9px; border:1px solid var(--line); border-radius:9px;
      background:var(--card); color:var(--text); font-size:13px; }
    .chip { display:inline-block; border:1px solid var(--line); border-radius:999px;
      padding:4px 10px; margin:2px 3px 2px 0; font-size:11px; font-weight:700;
      background:var(--soft); cursor:pointer; user-select:none; }
    .chip.on { background:var(--accent); color:#fff; border-color:var(--accent); }
    .chip.skipchip.on { background:var(--muted); border-color:var(--muted); }
    .bar { height:10px; background:var(--soft); border-radius:99px; overflow:hidden; margin-top:3px; }
    .bar i { display:block; height:100%; background:var(--accent); }
    .view { display:none; } .view.active { display:block; }
    code { background:var(--soft); border-radius:5px; padding:1px 5px; font-size:11px; }
    /* Mobile-style scroll indicators (thin rounded thumb, no track/arrows) */
    ::-webkit-scrollbar { width:5px; height:5px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-button { display:none; width:0; height:0; }
    ::-webkit-scrollbar-thumb { background:rgba(16,24,40,.28); border-radius:99px; }
    @media (prefers-color-scheme: dark) {
      ::-webkit-scrollbar-thumb { background:rgba(255,255,255,.22); }
    }
    @supports not selector(::-webkit-scrollbar) {
      * { scrollbar-width:thin; scrollbar-color:rgba(16,24,40,.28) transparent; }
      @media (prefers-color-scheme: dark) {
        * { scrollbar-color:rgba(255,255,255,.22) transparent; }
      }
    }
  </style>
</head>
<body>
<header>
  <h1>Lifestyle Survey — Explorer</h1>
  <p class="sub">Everything under the hood: the content table, the decision tree, a live persona lab, and the full combination sweep. Tune <code>js/lifestyle-survey-content.js</code>, refresh this tab, and watch the numbers move.</p>
</header>
<nav id="tabs"></nav>
<main>
  <section class="view" id="view-table"></section>
  <section class="view" id="view-tree"></section>
  <section class="view" id="view-lab"></section>
  <section class="view" id="view-sweep"></section>
</main>

<!-- Minimal stub so shared files load; the explorer never touches app state. -->
<script>var state = { budget: { profile: {}, categories: [], fixedOverhead: [] } };</script>
<script src="screens/budget-utils.js"></script>
<script src="js/budget-baseline.js"></script>
<script src="js/lifestyle-survey-content.js"></script>
<script src="js/lifestyle-survey-bridge.js"></script>
<script src="explorer/survey-explorer.js"></script>
</body>
</html>
