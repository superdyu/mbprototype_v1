<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoneyBuddy Prototype</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

<div class="page">

  <!-- Phone frame -->
  <main class="phone" aria-label="Phone frame">
    <div class="screen">
      <div id="screenRoot" class="screen-scroll"></div>
      <div id="navRoot"></div>
    </div>
  </main>

  <!-- Admin panel -->
  <aside class="admin" aria-label="Admin Tools">
    <div class="admin-header">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
        <p class="admin-title" style="margin:0;">Admin Tools</p>
        <button class="admin-collapse-btn" type="button" onclick="state.adminCollapsed=true;render()" title="Collapse admin">‹</button>
      </div>
      <p class="admin-subtitle" id="adminSubtitle">Manual controls for the active screen.</p>
      <button class="button secondary" style="margin-top:10px;width:100%;font-size:11px;" onclick="resetUserData()">Reset User Data</button>
      <button class="button secondary" id="colorModeBtn" style="margin-top:6px;width:100%;font-size:11px;" onclick="state.settings.colorMode=state.settings.colorMode==='dark'?'light':'dark';render();">Dark Mode</button>
      <button class="button secondary" style="margin-top:6px;width:100%;font-size:11px;" onclick="(function(){var s={screen:state.screen,budget:{status:state.budget.status,wizardInputs:state.budget.wizardInputs,debts:state.budget.debts},selectedBadge:state.selectedBadge,selectedDebt:state.selectedDebt,selectedOffer:state.selectedOffer};navigator.clipboard.writeText(JSON.stringify(s,null,2)).then(function(){alert('State copied to clipboard')}).catch(function(){prompt('Copy this state (Ctrl+A, Ctrl+C):',JSON.stringify(s,null,2))})})()">Copy State</button>
    </div>
    <div id="adminRoot" class="admin-scroll"></div>
    <div id="adminFooter" style="padding:10px 14px;border-top:1px solid var(--line);font-size:10px;color:var(--muted);flex-shrink:0;">
      <div id="adminNavLog" style="margin-bottom:4px;"></div>
      <div id="adminErrorLog"></div>
    </div>
  </aside>

</div>

<!-- Admin expand tab — visible only when admin is collapsed -->
<button id="adminExpandTab" class="admin-expand-tab" type="button" onclick="state.adminCollapsed=false;render()" title="Expand admin">›</button>

<!-- 0. Developer tooling: error catcher + nav log updater -->
<script>
window.__lastError = null;
window.__navLog = [];
window.onerror = function(msg, src, line, col) {
  window.__lastError = { msg: String(msg), src: String(src).split('/').pop(), line: line, col: col, screen: (typeof state !== 'undefined') ? state.screen : '?' };
  var el = document.getElementById('adminErrorLog');
  if (el) el.innerHTML = '<span style="color:var(--danger)">⚠ ' + window.__lastError.screen + ' · ' + window.__lastError.src + ':' + line + ' · ' + String(msg).slice(0,80) + '</span>';
};
window.onunhandledrejection = function(e) {
  window.__lastError = { msg: String(e.reason), screen: (typeof state !== 'undefined') ? state.screen : '?' };
  var el = document.getElementById('adminErrorLog');
  if (el) el.innerHTML = '<span style="color:var(--danger)">⚠ unhandled · ' + window.__lastError.screen + ' · ' + String(e.reason).slice(0,80) + '</span>';
};
</script>

<!-- 1. Data -->
<script src="js/state.js"></script>
<script src="js/utils.js"></script>

<!-- 2. Screen renderers -->
<script src="screens/home.js"></script>
<script src="screens/budget-utils.js"></script>
<script src="screens/budget.js"></script>
<script src="screens/budget-category.js"></script>
<script src="screens/baby-budget.js"></script>
<script src="screens/about-me.js"></script>
<script src="screens/budget-setup.js"></script>
<script src="screens/lifestyle.js"></script>
<script src="screens/lifestyle-chain.js"></script>
<script src="screens/account-balances.js"></script>
<script src="screens/debt-balances.js"></script>
<script src="screens/my-progress.js"></script>
<script src="screens/post-result.js"></script>
<script src="screens/next-action.js"></script>
<script src="screens/commitment.js"></script>
<script src="screens/finish.js"></script>
<script src="screens/goals.js"></script>
<script src="screens/learn.js"></script>
<script src="screens/topic.js"></script>
<script src="screens/reward-preview.js"></script>
<script src="screens/lesson.js"></script>
<script src="screens/quiz.js"></script>
<script src="screens/simulation.js"></script>
<script src="screens/marketplace.js"></script>
<script src="screens/marketplace-detail.js"></script>
<script src="screens/reward.js"></script>
<script src="screens/settings.js"></script>
<script src="screens/my-debts.js"></script>
<script src="screens/debt-analyzer.js"></script>

<!-- 3. Shared UI components -->
<script src="components/badge-ring.js"></script>
<script src="components/nav.js"></script>

<!-- 4. Core engine -->
<script src="js/render.js"></script>

</body>
</html>
